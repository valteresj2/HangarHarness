[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hangar-harness"
version = "0.7.7"
description = "Harness de agentes agnóstico de modelo, econômico em tokens e observável em tempo real"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["agent", "harness", "llm", "mcp", "openrouter"]

[project.urls]
Repository = "https://github.com/valteresj2/HangarHarness"

[project.scripts]
hangar = "hangar.cli:main"

[tool.setuptools]
packages = ["hangar"]

[tool.setuptools.package-data]
hangar = ["ui.html", "ui.css", "ui.js", "flow.js", "roster.json", "skills/*/*.md"]
